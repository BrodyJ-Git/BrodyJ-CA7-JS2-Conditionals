<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="author" content="Brody">
        <link href="css/style.css" rel="stylesheet">
        <title>Bear Ninja Hunter</title>
    </head>
    <body> 
        <script> <!-- Prompts the user and greets them -->
            const playerName = prompt('Welcome to Bear Hunter Ninja! Please enter your name to get started: ');
            alert(`Hi ${playerName} Let\'s Play!!`);
        </script>

        <p id="prompt1"></p> <!--Will be replaced with playerResult-->
        <p id="prompt2"></p> <!--Will be replaced with computerResult-->
        <p id="prompt3"></p> <!--Will be replaced with playerWin-->
        <script>
            // prompts the player and saves choice to prompt

            let playerChoiceString = prompt('Who are you: Bear, Ninja, or Hunter?');
            const computerChoice = 1; // temp
            let playerChoice = 1;

            // determines player choice as an int (toLowerCase() could be used)
            switch (playerChoiceString) 
            {
                case "Bear":
                    playerChoice = 1;
                    break;
                case "Ninja":
                    playerChoice = 2;
                    break;
                case "Hunter":
                    playerChoice = 3;
                    break;
                default:
                    playerChoice = 0; // invalid input makes you lose
            }


            // determines win message
            let playerWin = "";
            if (playerChoice == computerChoice)
            {
                playerWin = "You Tied!!";
            }
            else if ((playerChoice == 1 && computerChoice == 2) || (playerChoice == 2 && computerChoice == 3) || (playerChoice == 3 && computerChoice == 1))
            {
                playerWin = "You Win!!";
            }
            else
            {
                playerWin = "You Lose!!";
            }

            // string concatenation with game results
            let playerResult = playerName + ", You picked " + playerChoiceString;
            let computerResult = "The computer picked Bear!";

            //sends choice to console and replaces prompts on html page
            console.log(playerResult);
            console.log(computerResult);
            console.log(playerWin);

            document.getElementById("prompt1").innerHTML = playerResult;
            document.getElementById("prompt2").innerHTML = computerResult;
            document.getElementById("prompt3").innerHTML = playerWin;
        </script>
    </body>
</html>
